<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Tiny Society — a Worldbox-inspired POC</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        color: #e8ecf5;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        background: #08243a;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        pointer-events: none;
      }
      #topbar {
        top: 0;
        padding-top: max(8px, env(safe-area-inset-top));
        flex-wrap: wrap;
        row-gap: 4px;
      }
      #botbar {
        bottom: 0;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        justify-content: center;
      }
      .stat {
        background: rgba(8, 12, 26, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        backdrop-filter: blur(4px);
      }
      .stat b {
        font-weight: 600;
      }
      button {
        pointer-events: auto;
        background: rgba(8, 12, 26, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #e8ecf5;
        border-radius: 12px;
        min-width: 52px;
        min-height: 44px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }
      button.active {
        background: #2f7d4f;
        border-color: #4fbf7f;
      }
      button:active {
        transform: scale(0.96);
      }
      #newworld {
        min-width: 44px;
        font-size: 18px;
      }
      #inspector {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(64px + max(10px, env(safe-area-inset-bottom)));
        width: min(340px, calc(100vw - 20px));
        background: rgba(8, 12, 26, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        padding: 10px 12px;
        backdrop-filter: blur(6px);
        display: none;
        pointer-events: auto;
      }
      #inspector.open {
        display: block;
      }
      #inspector .head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      #inspector .head .sub {
        font-weight: 400;
        font-size: 12px;
        opacity: 0.7;
      }
      #inspector .close {
        margin-left: auto;
        min-width: 32px;
        min-height: 32px;
        border-radius: 8px;
        font-size: 14px;
      }
      #inspector .rows {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px 12px;
        font-size: 13px;
      }
      #inspector .rows div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #inspector .bar {
        position: relative;
        grid-column: 1 / -1;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
        margin-top: 4px;
        padding: 0;
        display: block;
      }
      #inspector .bar i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 3px;
        background: #d9a54a;
      }
      #toast {
        position: absolute;
        left: 50%;
        bottom: 84px;
        transform: translateX(-50%);
        background: rgba(8, 12, 26, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
        max-width: 90vw;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="topbar" class="bar"></div>
      <div id="botbar" class="bar">
        <button id="speed-0" aria-label="Pause">⏸</button>
        <button id="speed-1" class="active">1×</button>
        <button id="speed-4">4×</button>
        <button id="speed-16">16×</button>
        <button id="newworld" aria-label="New world" title="New world">🌍</button>
      </div>
      <div id="inspector">
        <div class="head">
          <span id="insp-title"></span>
          <span class="sub" id="insp-sub"></span>
          <button class="close" id="insp-close" aria-label="Close">✕</button>
        </div>
        <div class="rows" id="insp-rows"></div>
      </div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

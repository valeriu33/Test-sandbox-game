name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/worldbox-society-sim-poc-s1e5jq
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publishing to the gh-pages branch auto-enables GitHub Pages for it,
      # which the GITHUB_TOKEN cannot do for the "GitHub Actions" source.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
